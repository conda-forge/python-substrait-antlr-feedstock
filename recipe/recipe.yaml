schema_version: 1

context:
  version: "0.85.0"

package:
  name: python-substrait-antlr
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/substrait-antlr/substrait_antlr-${{ version }}.tar.gz
  sha256: caf7197e065f9d50b51e8aca6607abd24219ce82dbf4e5a5f70eb711388436c2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=80
    - pip
  run:
    - python >=${{ python_min }}
    - antlr4-python3-runtime >=4.13,<5

tests:
  - python:
      imports:
        - substrait_antlr.substrait_type.SubstraitTypeParser
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Generated Substrait ANTLR Parser Code
  license: Apache-2.0
  # The 0.79.0 sdist does not bundle a license file; the LICENSE here is a vendored copy.
  # Upstream ships it from 0.97.0 on (substrait-io/substrait-packaging#29) — when bumping
  # this recipe to >=0.97.0, drop the vendored LICENSE and rely on the one in the sdist.
  license_file: LICENSE
  homepage: https://substrait.io
  repository: https://github.com/substrait-io/substrait-packaging

extra:
  recipe-maintainers:
    - benbellick
    - nielspardon
